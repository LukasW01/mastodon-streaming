# APP
quarkus.jackson.write-dates-as-timestamps=true
quarkus.http.port=${PORT:4000}
quarkus.http.host=${BIND:127.0.0.1}

# CORS: the streaming API can be used from any origin
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/

# DB
quarkus.datasource.jdbc.max-size=${DB_POOL:10}
quarkus.datasource.jdbc.acquisition-timeout=15S

# WebSocket
# INFO: Note: we currently pass the AccessToken via the websocket subprotocol
# field, an anti-pattern, but browsers abort the connection unless the server
# echeos the offered subprotocol, which is what the wildcard does.
quarkus.websockets-next.server.supported-subprotocols=*

# Swagger/OpenAPI
quarkus.smallrye-openapi.path=/docs/openapi
quarkus.swagger-ui.path=/docs/swagger-ui
quarkus.swagger-ui.title=Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Mastodon (Streaming)
quarkus.smallrye-openapi.info-license-name=MIT License
quarkus.smallrye-openapi.info-license-url=https://en.wikipedia.org/wiki/MIT_License
# Health
quarkus.smallrye-health.root-path=/health/app

# Sentry
quarkus.log.sentry.enabled=true
quarkus.log.sentry.dsn=https://e47b8742451c4187bb48cb86eb336183@sentry.wigger.one/7
quarkus.log.sentry.in-app-packages=*
quarkus.log.sentry.level=ERROR

# Logging
quarkus.log.level=${LOG_LEVEL:INFO}

# Metrics
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.http.filter.metrics.matches=/metrics
quarkus.http.filter.metrics.header."Cache-Control"=private, no-store
