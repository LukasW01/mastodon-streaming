# DB
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://${POSTGRES_HOST:}:${POSTGRES_PORT:5432}/${POSTGRES_DB:}}
quarkus.hibernate-orm.schema-management.strategy=none

# REDIS
quarkus.redis.hosts=${REDIS_URL:redis://${REDIS_USER:}@${REDIS_HOST:}:${REDIS_PORT:6379}/${REDIS_DB:0}}
quarkus.redis.password=${REDIS_PASSWORD:}
# OPTIONAL: Namespace (optional, mirrors REDIS_NAMESPACE)
mastodon.redis.namespace=${REDIS_NAMESPACE:}

# Logging
quarkus.log.category."dev.mastodon.streaming".level=DEBUG