# TEST
quarkus.hibernate-orm.mapping.format.global=ignore

# DB
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:test.sqlite
quarkus.hibernate-orm.schema-management.strategy=none

# REDIS
quarkus.redis.hosts=${REDIS_URL:redis://${REDIS_USER:}@${REDIS_HOST:}:${REDIS_PORT:6379}/${REDIS_DB:0}}
quarkus.redis.password=${REDIS_PASSWORD:}
# OPTIONAL: Namespace (optional, mirrors REDIS_NAMESPACE)
mastodon.redis.namespace=${REDIS_NAMESPACE:}
